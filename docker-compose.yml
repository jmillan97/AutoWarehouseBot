services:


  # ── Dev shell — interactive development (laptop) ─────────────────────────────
  # VS Code Dev Container attaches here.
  # ────────────────────────────────────────────────────────────────────────────
  dev:
    user: ubuntu
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: warehousebot_dev
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_DEFAULT_PROFILES_FILE=/workspaces/AutoWarehouseBot/docker/fastdds_config.xml
      - ROS_LOCALHOST_ONLY=0      
      - DISPLAY
      - WAYLAND_DISPLAY
      - XDG_RUNTIME_DIR
      - PULSE_SERVER
    volumes:
      - .:/workspaces/AutoWarehouseBot:cached
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: sleep infinity
    stdin_open: true
    tty: true

  # ── Robot profile — Raspberry Pi ─────────────────────────────────────────────
  # Runs hardware-facing nodes.
  # On Pi: docker compose --profile discovery --profile robot up
  #no longer used since ros2 runs natively
  # ────────────────────────────────────────────────────────────────────────────
  robot:
    profiles: ["robot"]
    build:
      context: .
      dockerfile: docker/Dockerfile.robot
    container_name: warehousebot_robot
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_DEFAULT_PROFILES_FILE=/workspaces/AutoWarehouseBot/docker/fastdds_config.xml
       - ROS_LOCALHOST_ONLY=0
    volumes:
      - .:/workspaces/AutoWarehouseBot:cached
    command: >
      bash -c "source /opt/ros/kilted/setup.bash &&
               source /workspaces/AutoWarehouseBot/install/setup.bash &&
               ros2 launch navigation nav2.launch.py"
    stdin_open: true
    tty: true

  # ── Compute profile — Laptops ────────────────────────────────────────────────
  # Runs heavy compute: Nav2, YOLO, RViz.
  # On laptop: docker compose --profile compute up
  # ────────────────────────────────────────────────────────────────────────────
  compute:
    profiles: ["compute"]
    user: ubuntu
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: warehousebot_compute
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_DEFAULT_PROFILES_FILE=/workspaces/AutoWarehouseBot/docker/fastdds_config.xml
      - ROS_LOCALHOST_ONLY=0
      - DISPLAY
      - WAYLAND_DISPLAY
      - XDG_RUNTIME_DIR
      - PULSE_SERVER
    volumes:
      - .:/workspaces/AutoWarehouseBot:cached
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: >
      bash -c "source /opt/ros/kilted/setup.bash &&
               source /workspaces/AutoWarehouseBot/install/setup.bash &&
               ros2 launch navigation hardware.launch.py use_rviz:=true"
    stdin_open: true
    tty: true

  # ── Simulation profile — Full sim, no Pi needed ──────────────────────────────
  # On laptop: docker compose --profile sim up
  # ────────────────────────────────────────────────────────────────────────────
  sim:
    profiles: ["sim"]
    user: ubuntu
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: warehousebot_sim
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_DEFAULT_PROFILES_FILE=/workspaces/AutoWarehouseBot/docker/fastdds_config.xml
      - ROS_LOCALHOST_ONLY=0
      - DISPLAY
      - WAYLAND_DISPLAY
      - XDG_RUNTIME_DIR
      - PULSE_SERVER
    volumes:
      - .:/workspaces/AutoWarehouseBot:cached
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: >
      bash -c "source /opt/ros/kilted/setup.bash &&
               source /workspaces/AutoWarehouseBot/install/setup.bash &&
               ros2 launch navigation gazebo.launch.py use_rviz:=true"
    stdin_open: true
    tty: true

  # ── Visualization Bridge ───────────────────────────────────────────────────
  # Bridges ROS2 topics to Foxglove Studio.
  # ────────────────────────────────────────────────────────────────────────────
  foxglove:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: warehousebot_foxglove
    ports:
      - "8765:8765"
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_DEFAULT_PROFILES_FILE=/workspaces/AutoWarehouseBot/docker/fastdds_config.xml
      - ROS_LOCALHOST_ONLY=0
    command: >
      bash -c "source /opt/ros/kilted/setup.bash &&
               if [ -f /workspaces/AutoWarehouseBot/install/setup.bash ]; then source /workspaces/AutoWarehouseBot/install/setup.bash; fi &&
               ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765 address:=0.0.0.0"
    restart: unless-stopped