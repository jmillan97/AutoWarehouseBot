# bridge.yaml
# ===========
# Maps Gazebo Ionic topics to ROS2 topics for warehouse_bot.
#
# Direction conventions:
#   ROS_TO_GZ  — ROS2 publishes, Gazebo subscribes (commands)
#   GZ_TO_ROS  — Gazebo publishes, ROS2 subscribes (sensor data)

# ---- Drive commands: ROS2 Nav2 MPPI → Gazebo diff drive ----
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/warehouse_bot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
  lazy: true

# ---- Odometry: Gazebo diff drive → ROS2 EKF ----
- ros_topic_name: "/odom"
  gz_topic_name: "/model/warehouse_bot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
  lazy: true

# ---- TF: Gazebo → ROS2 (odom -> base_link) ----
- ros_topic_name: "/tf"
  gz_topic_name: "/model/warehouse_bot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
  lazy: true

# ---- LiDAR: Gazebo sensor → ROS2 /scan ----
- ros_topic_name: "/scan"
  gz_topic_name: "/model/warehouse_bot/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
  lazy: true
  frame_id: "base_laser"

# ---- Clock: Gazebo sim time → ROS2 ----
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  lazy: true
